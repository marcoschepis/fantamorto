<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Base -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantamorto Cup 2026</title>
    <meta name="description" content="Il fantamorto tra amici: scegli la squadra, scala la classifica.">

    <!-- Anteprima social / WhatsApp (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://marcoschepis.github.io/fantamorto/">
    <meta property="og:title" content="☠️ Fantamorto">
    <meta property="og:description" content="Classifica, squadre e punteggi. Entra e scopri chi è in testa.">
    <meta property="og:image" content="https://marcoschepis.github.io/fantamorto/loghi/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="it_IT">

    <!-- Cache (vedi nota sotto) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Web App / mobile -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fantamorto">

    <!-- Icone -->
    <link rel="icon" type="image/svg+xml" href="loghi/logo_fantamorto.svg">
    <link rel="icon" type="image/png" href="loghi/logo_fantamorto.png">
    <link rel="apple-touch-icon" href="loghi/logo_fantamorto.png">

    <!-- Stili -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RN4LEG6EJ5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-RN4LEG6EJ5', { 'send_page_view': false });
    </script>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader-icon">💀</div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>
    <datalist id="lista-suggerimenti"></datalist>
    <header>
        <div id="site-logo" class="header">
            <h1>☠️ Fantamorto 2026</h1>
            <div class="days-container">
                <span id="days-number">0</span>
                <span class="days-label"> giorni alla fine</span>
            </div>
        </div>
        <nav id="main-nav" class="bottom-nav">
            <button id="btn-rank" class="nav-item active" onclick="switchView('rank')">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">Classifica</span>
            </button>
            <button id="btn-teams" class="nav-item" onclick="switchView('teams')">
                <span class="nav-icon">👪</span>
                <span class="nav-label">Squadre</span>
            </button>
            <button id="btn-points" class="nav-item" onclick="switchView('points')">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Punteggi</span>
            </button>
            <button id="btn-mercato" class="nav-item" onclick="switchView('mercato')">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Mercato</span>
            </button>
            <button id="btn-regolamento" class="nav-item" onclick="switchView('regolamento')">
                <span class="nav-icon">📜</span>
                <span class="nav-label">Regole</span>
            </button>
            <button id="btn-admin" class="nav-item" onclick="switchView('admin')">
                <span class="nav-icon">🔧</span>
                <span class="nav-label">Admin</span>
            </button>
        </nav>
    </header>

    <div id="view-rank" class="view active">
        <div id="rank-container"></div>
    </div>

    <div id="view-teams" class="view">
        <div id="teams-container"></div>
    </div>

    <div id="view-points" class="view">
        <div id="points-container"></div>
    </div>

    <div id="view-mercato" class="view">
        <div class="card" style="border-top: 4px solid #44aaff;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px; width: 100%; margin-bottom: 20px;">
                <select id="user-team-select" onchange="render()" style="margin: 0; min-width: 0;"><option value="">-- Seleziona Squadra --</option></select>
                <div id="mercato-morituri-display" style="flex-shrink: 0; text-align: right; white-space: nowrap;"></div>
                <div id="mercato-budget-display" style="flex-shrink: 0; text-align: right; white-space: nowrap;"></div>
            </div>
            <div id="mercato-editor"></div>
        </div>
        <div style="text-align:center;">
            <button onclick="saveToGitHub(event, 'user')">💾 Salva sul sito</button>
        </div>
    </div>

    <div id="view-admin" class="view">
        <div id="admin-container"></div>
        <div style="text-align:center;">
            <button onclick="saveToGitHub(event, 'admin')">💾 Salva sul sito</button>
        </div>
    </div>

    <div id="view-regolamento" class="view">
        <div class="card" style="padding: 20px; background: #111; color: #eee; border: 1px solid #333; line-height: 1.6;">
            <div id="regolamento-container">Caricamento regolamento...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>

    <script src="js/views/classifica.js"></script>
    <script src="js/views/squadre.js"></script>
    <script src="js/views/punteggi.js"></script>
    <script src="js/views/mercato.js"></script>
    <script src="js/views/admin.js"></script>
    <script src="js/views/regolamento.js"></script>

    <script src="js/script.js"></script>

    <!-- Banner Avviso Offline / Cache -->
    <div id="offline-toast"></div>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error('Errore SW:', err));
            });

            let countdownInterval = null;

            // Mostra toast offline
            const showOfflineToast = () => {
                const toast = document.getElementById('offline-toast');
                if (!toast) return;

                // Interrompe un eventuale conto alla rovescia in corso se torna offline
                if (countdownInterval) clearInterval(countdownInterval);

                toast.textContent = '✈️ Sei Offline: Stai visualizzando i dati salvati in cache.';
                toast.className = 'offline';
                toast.style.display = 'block';
            };

            // Mostra toast verde online con conto alla rovescia e reload
            const showOnlineToast = () => {
                const toast = document.getElementById('offline-toast');
                if (!toast || toast.style.display === 'none') return;

                if (countdownInterval) clearInterval(countdownInterval);

                let secondsLeft = 3;
                toast.className = 'online';
                toast.textContent = `🌐 Connessione ripristinata! Ricarica pagina tra ${secondsLeft}s...`;
                toast.style.display = 'block';

                countdownInterval = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        toast.textContent = `🌐 Connessione ripristinata! Ricarica pagina tra ${secondsLeft}s...`;
                    } else {
                        clearInterval(countdownInterval);
                        window.location.reload();
                    }
                }, 1000);
            };

            // Stato iniziale
            if (!navigator.onLine) showOfflineToast();

            // Eventi di cambio rete
            window.addEventListener('offline', showOfflineToast);
            window.addEventListener('online', showOnlineToast);

            // Notifica da SW se carica da cache
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'USING_CACHE') {
                    showOfflineToast();
                }
            });
        }
    </script>
</body>
</html>
